# Ruff — линтер и форматтер проекта LLM Test Bench.
# Это техническая часть стандартов код-ревью (см. REVIEW_STANDARDS.md).
#
# Запуск:  .venv/Scripts/ruff.exe check .
# Формат:  .venv/Scripts/ruff.exe format .
#
# Политика:
#   Блокирующие (в `select`, обязательны для слияния):
#       E   — pycodestyle: явные ошибки (E402 — импорт не сверху и т.п.)
#       F   — pyflakes: мёртвые импорты, неопределённые имена, мусор
#       B   — bugbear: конструкции, которые почти всегда баг
#   Рекомендательные (в `ignore`, сборку не роняют):
#       UP* — актуализация синтаксиса 3.13. Их у нас сотни, переписывать всё
#       сразу нецелесообразно; новые файлы пишем на f-строках.
#       SIM* — «сделай короче»; правим по желанию, не обязательна.
#       TRY300 — «переместите оператор в else»: стиль, а не баг.

target-version = "py313"
line-length = 99

[lint]
select = ["E", "F", "B"]

# Что мы сознательно не требуем сейчас — с пояснением, чтобы не переоткрывать спор.
ignore = [
    # TRY300 намеренно ВЫКЛЮЧЕН, поэтому его нет в `select`: в проекте много
    # try/except без else, и переписывать их ради стиля не надо. Настоящий баг
    # в этой области — B904 («поднимать исключение с `from`»), он блокирующий.
    # Раньше TRY300 стоял одновременно и в select, и здесь — то есть в конфиге
    # было написано одно, а работало другое.
    "TRY300",
    # Глухой `except Exception` ruff не проверяет вовсе: отказоустойчивость —
    # осознанное решение (сбой стенда не должен ронять прогон). Это правило
    # разбирает check_review.py (R1/R2), и разбирает по делу: смотрит не на
    # факт `except Exception`, а на то, остался ли от ошибки след.
    "BLE001",
    # Длина строки: line-length=99, переносы расставляет ruff format.
    "E501",
    # f-строки и актуальные пайплайны: 400+ старых `%`-форматирований,
    # переписываем постепенно, новые файлы — на f-строках.
    "UP031", "UP006", "UP035", "UP007", "UP037", "UP041", "UP042", "UP015",
    # «сделай короче» — рекомендация, не блокировщик.
    "SIM105", "SIM108", "SIM114", "SIM115",
]

# В `__init__.py` импорт ради реэкспорта — не «неиспользуемый».
[lint.per-file-ignores]
"*/__init__.py" = ["F401"]

[format]
quote-style = "double"
