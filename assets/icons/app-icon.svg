<svg xmlns="http://www.w3.org/2000/svg" viewBox="52 92 136 136" width="512" height="512">
  <!-- Иконка приложения: куб «GGUF» из Модель.svg без подписи вкладки и без
       тени-подложки. Область обрезана по кубу (в исходнике он занимает
       x 68..172, y 100..220) с полем ~16 единиц. Меняешь геометрию куба —
       поправь viewBox, иначе иконка поедет. -->
  <defs>
    <linearGradient id="faceTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2a45"/>
      <stop offset="100%" stop-color="#1e1e35"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151528"/>
      <stop offset="100%" stop-color="#0e0e1c"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#20203a"/>
      <stop offset="100%" stop-color="#16162a"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4da6ff"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glowBlue">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g transform="translate(120, 160)">
    <polygon points="0,-60 52,-30 0,0 -52,-30" fill="url(#faceTop)" stroke="#2a2a45" stroke-width="1"/>
    <polygon points="-52,-30 0,0 0,60 -52,30" fill="url(#faceLeft)" stroke="#151528" stroke-width="1"/>
    <polygon points="52,-30 0,0 0,60 52,30" fill="url(#faceRight)" stroke="#20203a" stroke-width="1"/>
    <polygon points="0,-60 52,-30 0,0 -52,-30" fill="url(#accentBlue)" opacity="0.15"/>
    <text x="0" y="-22" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#4da6ff" filter="url(#glowBlue)">GGUF</text>
    <line x1="-42" y1="-18" x2="-10" y2="-2" stroke="#4da6ff" stroke-width="2" opacity="0.6"/>
    <line x1="-42" y1="-8" x2="-10" y2="8" stroke="#4da6ff" stroke-width="2" opacity="0.4"/>
    <line x1="-42" y1="2" x2="-10" y2="18" stroke="#4da6ff" stroke-width="2" opacity="0.3"/>
    <circle cx="20" cy="-8" r="3" fill="#4da6ff" opacity="0.7" filter="url(#glowBlue)"/>
    <circle cx="32" cy="-2" r="3" fill="#4da6ff" opacity="0.5"/>
    <circle cx="20" cy="8" r="3" fill="#4da6ff" opacity="0.3"/>
  </g>
</svg>
