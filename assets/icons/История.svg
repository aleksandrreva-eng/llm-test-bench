<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320">
  <defs>
    <linearGradient id="faceTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2a45"/>
      <stop offset="100%" stop-color="#1e1e35"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151528"/>
      <stop offset="100%" stop-color="#0e0e1c"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#20203a"/>
      <stop offset="100%" stop-color="#16162a"/>
    </linearGradient>
    <linearGradient id="accentRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="glowRed">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowOrange">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#000" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(120, 160)">
    <ellipse cx="0" cy="90" rx="60" ry="15" fill="url(#shadow)"/>
    <polygon points="0,-15 50,15 0,45 -50,15" fill="url(#faceTop)" stroke="#2a2a45" stroke-width="1"/>
    <polygon points="-50,15 0,45 0,65 -50,35" fill="url(#faceLeft)" stroke="#151528" stroke-width="1"/>
    <polygon points="50,15 0,45 0,65 50,35" fill="url(#faceRight)" stroke="#20203a" stroke-width="1"/>
    <polygon points="0,-40 50,-10 0,20 -50,-10" fill="url(#faceTop)" stroke="#2a2a45" stroke-width="1"/>
    <polygon points="-50,-10 0,20 0,40 -50,10" fill="url(#faceLeft)" stroke="#151528" stroke-width="1"/>
    <polygon points="50,-10 0,20 0,40 50,10" fill="url(#faceRight)" stroke="#20203a" stroke-width="1"/>
    <polygon points="0,-65 50,-35 0,-5 -50,-35" fill="url(#faceTop)" stroke="#2a2a45" stroke-width="1"/>
    <polygon points="-50,-35 0,-5 0,15 -50,-15" fill="url(#faceLeft)" stroke="#151528" stroke-width="1"/>
    <polygon points="50,-35 0,-5 0,15 50,-15" fill="url(#faceRight)" stroke="#20203a" stroke-width="1"/>
    <polygon points="0,-65 50,-35 0,-5 -50,-35" fill="url(#accentRed)" opacity="0.1"/>
    <path d="M-25,-40 L-5,-40" stroke="#f87171" stroke-width="2.5" fill="none" filter="url(#glowRed)"/>
    <path d="M5,-45 L25,-45" stroke="#fbbf24" stroke-width="2.5" fill="none" filter="url(#glowOrange)"/>
    <path d="M-25,-30 L25,-30" stroke="#f87171" stroke-width="2" fill="none" opacity="0.5" stroke-dasharray="4,3"/>
    <text x="0" y="-15" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#f87171" font-weight="bold">1</text>
    <text x="0" y="10" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#fbbf24" font-weight="bold">2</text>
    <text x="0" y="35" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#4ade80" font-weight="bold">3</text>
    <line x1="0" y1="-5" x2="0" y2="20" stroke="#f87171" stroke-width="1" opacity="0.3" stroke-dasharray="3,2"/>
    <line x1="0" y1="20" x2="0" y2="45" stroke="#f87171" stroke-width="1" opacity="0.3" stroke-dasharray="3,2"/>
    <text x="0" y="105" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#8899aa">История</text>
  </g>
</svg>