<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320">
  <defs>
    <linearGradient id="faceTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2a45"/>
      <stop offset="100%" stop-color="#1e1e35"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151528"/>
      <stop offset="100%" stop-color="#0e0e1c"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#20203a"/>
      <stop offset="100%" stop-color="#16162a"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glowPurple">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#000" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(120, 160)">
    <ellipse cx="0" cy="90" rx="60" ry="15" fill="url(#shadow)"/>
    <polygon points="0,-20 55,10 0,40 -55,10" fill="url(#faceTop)" stroke="#2a2a45" stroke-width="1"/>
    <polygon points="-55,10 0,40 0,65 -55,35" fill="url(#faceLeft)" stroke="#151528" stroke-width="1"/>
    <polygon points="55,10 0,40 0,65 55,35" fill="url(#faceRight)" stroke="#20203a" stroke-width="1"/>
    <polygon points="-8,-55 8,-55 12,-10 -12,-10" fill="url(#accentPurple)" opacity="0.9"/>
    <polygon points="8,-55 12,-10 8,-10 4,-55" fill="#5b21b6" opacity="0.5"/>
    <polygon points="-20,-65 20,-65 24,-55 -24,-55" fill="url(#accentPurple)"/>
    <polygon points="20,-65 24,-55 20,-55 16,-65" fill="#6d28d9" opacity="0.6"/>
    <polygon points="-24,-55 -20,-65 -16,-55 -20,-45" fill="#7c3aed" opacity="0.4"/>
    <polygon points="-10,-63 10,-63 12,-58 -12,-58" fill="#c4b5fd" opacity="0.4"/>
    <circle cx="30" cy="-50" r="3" fill="#a78bfa" filter="url(#glowPurple)"/>
    <circle cx="-35" cy="-45" r="2" fill="#a78bfa" opacity="0.7" filter="url(#glowPurple)"/>
    <circle cx="25" cy="-70" r="2" fill="#a78bfa" opacity="0.5"/>
    <path d="M-20,5 L-10,15 L5,0" stroke="#a78bfa" stroke-width="3" fill="none" opacity="0.7" filter="url(#glowPurple)"/>
    <path d="M10,10 L18,18 L30,6" stroke="#a78bfa" stroke-width="3" fill="none" opacity="0.5"/>
    <text x="0" y="105" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#8899aa">Тесты</text>
  </g>
</svg>