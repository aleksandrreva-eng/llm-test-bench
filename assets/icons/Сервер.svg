<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320">
  <defs>
    <linearGradient id="faceTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2a45"/>
      <stop offset="100%" stop-color="#1e1e35"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151528"/>
      <stop offset="100%" stop-color="#0e0e1c"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#20203a"/>
      <stop offset="100%" stop-color="#16162a"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="glowGreen">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#000" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(120, 160)">
    <ellipse cx="0" cy="90" rx="60" ry="15" fill="url(#shadow)"/>
    <polygon points="0,-70 45,-45 0,-20 -45,-45" fill="url(#faceTop)" stroke="#2a2a45" stroke-width="1"/>
    <polygon points="-45,-45 0,-20 0,60 -45,35" fill="url(#faceLeft)" stroke="#151528" stroke-width="1"/>
    <polygon points="45,-45 0,-20 0,60 45,35" fill="url(#faceRight)" stroke="#20203a" stroke-width="1"/>
    <polygon points="0,-70 45,-45 0,-20 -45,-45" fill="url(#accentGreen)" opacity="0.12"/>
    <line x1="-35" y1="-30" x2="-10" y2="-17" stroke="#4ade80" stroke-width="2" opacity="0.5"/>
    <line x1="-35" y1="-20" x2="-10" y2="-7" stroke="#4ade80" stroke-width="2" opacity="0.4"/>
    <line x1="-35" y1="-10" x2="-10" y2="3" stroke="#4ade80" stroke-width="2" opacity="0.3"/>
    <line x1="-35" y1="0" x2="-10" y2="13" stroke="#4ade80" stroke-width="2" opacity="0.2"/>
    <circle cx="18" cy="-28" r="3" fill="#4ade80" filter="url(#glowGreen)"/>
    <circle cx="28" cy="-22" r="3" fill="#4ade80" opacity="0.6"/>
    <circle cx="38" cy="-16" r="3" fill="#4ade80" opacity="0.3"/>
    <circle cx="18" cy="-12" r="3" fill="#fbbf24" opacity="0.5"/>
    <circle cx="28" cy="-6" r="3" fill="#fbbf24" opacity="0.3"/>
    <circle cx="0" cy="-48" r="5" fill="#4ade80" opacity="0.8" filter="url(#glowGreen)"/>
    <circle cx="0" cy="-48" r="10" fill="none" stroke="#4ade80" stroke-width="1" opacity="0.3"/>
    <text x="0" y="105" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#8899aa">Сервер</text>
  </g>
</svg>